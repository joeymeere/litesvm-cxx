name: Refresh libs

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      version:
        description: "litesvm version (blank = latest on crates.io)"
        required: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      build: ${{ steps.v.outputs.build }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        env:
          WANT: ${{ inputs.version }}
          EVENT: ${{ github.event_name }}
        run: |
          current="$(sed -nE 's/^#define LITESVM_UPSTREAM_VERSION "([^"]+)"/\1/p' include/litesvm.h)"
          latest="$(curl -fsSL -A litesvm-cxx https://crates.io/api/v1/crates/litesvm |
              python3 -c 'import json,sys; print(json.load(sys.stdin)["crate"]["max_stable_version"])')"
          version="${WANT:-$latest}"
          echo "current=$current latest=$latest target=$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = workflow_dispatch ] || [ "$version" != "$current" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { os: ubuntu-24.04,     platform: linux-x64 }
          - { os: ubuntu-24.04-arm, platform: linux-arm64 }
          - { os: macos-15,         platform: darwin-arm64 }
          - { os: macos-15-intel,   platform: darwin-x64 }
    steps:
      - uses: actions/checkout@v5
      - name: Bump to litesvm ${{ needs.check.outputs.version }}
        run: etc/scripts/bump.sh "${{ needs.check.outputs.version }}"
      - run: make lib test
      - uses: actions/upload-artifact@v4
        with:
          name: lib-${{ matrix.platform }}
          path: libs/${{ matrix.platform }}/liblitesvm.a
          if-no-files-found: error

  pr:
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - run: etc/scripts/bump.sh "${{ needs.check.outputs.version }}"
      - uses: actions/download-artifact@v4
        with:
          pattern: lib-*
          path: artifacts
      - name: Place archives
        run: |
          for d in artifacts/lib-*; do
            platform="${d#artifacts/lib-}"
            mkdir -p "libs/$platform"
            cp "$d/liblitesvm.a" "libs/$platform/liblitesvm.a"
          done
          rm -rf artifacts
          ls -lh libs/*/liblitesvm.a
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: refresh/litesvm-${{ needs.check.outputs.version }}
          commit-message: "chore: rebuild libs for litesvm ${{ needs.check.outputs.version }}"
          title: "Rebuild libs for litesvm ${{ needs.check.outputs.version }}"
          body: |
            Automated by `refresh.yml`: Cargo.lock seeded from LiteSVM's
            v${{ needs.check.outputs.version }} lockfile, archives rebuilt and
            smoke-tested on native runners for every platform in `libs/`.

            Bump `LITESVM_CXX_VERSION` / `Cargo.toml` and tag after merging
            if this should ship as a release.
