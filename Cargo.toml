[package]
name = "litesvm-cxx"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
description = "C ABI for LiteSVM"
publish = false

[lib]
name = "litesvm"
crate-type = ["staticlib", "cdylib"]

[dependencies]
agave-feature-set = "4.3.0"
bincode = "1.3.3"
litesvm = { version = "=0.18.1", features = ["nodejs-internal", "persistence-internal"] }
solana-account = "4.3.0"
solana-address = { version = "2.7", features = ["curve25519"] }
solana-clock = "3.2"
solana-compute-budget = "4.3.0"
solana-epoch-rewards = "3.2"
solana-epoch-schedule = "3.3"
solana-hash = "4.6"
solana-instruction = "~3.5"
solana-keypair = "3.1"
solana-last-restart-slot = "3.2"
solana-message = "4.2"
solana-program-error = "3.0"
solana-rent = "4.4"
solana-signature = "3.5"
solana-signer = "3.0"
solana-slot-hashes = "3.2"
solana-slot-history = "3.2"
solana-stake-history = "1.1"
solana-system-interface = { version = "3.2", features = ["bincode"] }
solana-transaction = { version = "4.1", features = ["serde"] }
solana-transaction-error = { version = "3.4", features = ["serde"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = "debuginfo"
panic = "unwind"
opt-level = "s"

[profile.dev]
panic = "unwind"
